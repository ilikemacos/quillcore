<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>QuillCore test dashboard</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#14171c;--mute:#5d6673;--line:#e2e5ea;--ok:#1a7f4b;--bad:#c62f2f;--na:#8a93a0;--on:#2f6fdf;--off:#e07b16}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#181c22;--fg:#e8ebef;--mute:#98a2ae;--line:#2a3039;--ok:#3fbf7f;--bad:#ff6b6b;--na:#6b7480;--on:#6ea0ff;--off:#ffa24a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{width:100%;min-height:100vh;margin:0;padding:clamp(14px,2vw,32px) clamp(14px,2.5vw,40px) 40px}
#fs{position:fixed;top:14px;right:16px;z-index:5;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}#fs:hover{border-color:var(--on)}
svg{display:block;height:auto}h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;margin:28px 0 10px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.sub{color:var(--mute)}.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card .k{color:var(--mute);font-size:12px}.card .v{font-size:28px;font-weight:650;margin:4px 0}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;color:#fff}
.pass{background:var(--ok)}.inv{background:#b7791f}.fail{background:var(--bad)}.na{background:var(--na)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px;display:flex}.bar i{display:block;height:100%}
table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mute);font-weight:500;font-size:12px}
code{font:12px ui-monospace,Consolas,monospace}.msg{color:var(--bad);white-space:pre-wrap}
svg text{fill:var(--mute);font-size:11px}.legend span{display:inline-flex;align-items:center;gap:6px;margin-right:14px;font-size:12px}.legend b{width:14px;height:3px;border-radius:2px;display:inline-block}
.empty{color:var(--mute);padding:26px;text-align:center;border:1px dashed var(--line);border-radius:10px}
</style>
</head>
<body>
<script>
window.quillLoad = (render) => {
  const id = new URLSearchParams(location.search).get('id');
  const app = document.getElementById('app');
  if (!id) { app.innerHTML = '<p>No run id. <a href="/">All runs</a></p>'; return; }
  fetch('/api/runs?id=' + encodeURIComponent(id)).then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(d => { render(d); document.title = 'QuillCore run ' + id;
      app.insertAdjacentHTML('afterbegin', '<p><a href="/">← All runs</a></p>'); })
    .catch(e => { app.innerHTML = '<p>Run not found (' + e + '). <a href="/">All runs</a></p>'; });
};
</script>
<button id="fs" title="Toggle fullscreen (F / Esc)">⛶ Fullscreen</button><main id="app"></main>
<script>
const EMBED = /*__QUILL_DATA__*/null;
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = (x) => x == null || x === '' || !isFinite(x) ? null : Number(x);
const f = (x, d = 1) => num(x) == null ? 'n/a' : num(x).toFixed(d);
const ratio = (lo, avg) => num(lo) == null || !num(avg) ? 'n/a' : (num(lo) / num(avg) * 100).toFixed(0) + '%';
function render(D) {
const app = document.getElementById('app');
app.innerHTML = '';
const m = D.meta || {};
app.append($(`<header><h1>QuillCore test dashboard</h1><div class="sub">${esc(m.generated)} · commit <code>${esc(m.commit)}</code> · ${D.overall === 'pass' ? '<span class="pill pass">ALL GREEN</span>' : D.overall === 'fail' ? '<span class="pill fail">FAILURES</span>' : D.overall === 'invalid' ? '<span class="pill inv">TESTS GREEN · BENCH INVALID</span>' : '<span class="pill na">PARTIAL</span>'}</div></header>`));

// ---- layer cards
app.append($('<h2>Layers</h2>'));
const cards = $('<div class="grid"></div>');
for (const L of D.layers) {
  let status, body;
  if (L.status === 'not run') { status = '<span class="pill na">NOT RUN</span>'; body = `<div class="v" style="color:var(--na)">—</div><div class="sub">${esc(L.note || 'layer did not run')}</div>`; }
  else if (L.status === 'invalid') { status = '<span class="pill inv">INVALID</span>'; body = `<div class="v" style="color:#b7791f">${L.passed}<span class="sub" style="font-size:16px"> / ${L.tests} segments</span></div><div class="sub">Numbers not comparable:</div><ul class="sub" style="margin:4px 0 0;padding-left:18px">${(L.invalidReasons || []).map(r => `<li>${esc(r)}</li>`).join('')}</ul>`; }
  else {
    status = L.failed > 0 || L.tests === 0 ? '<span class="pill fail">FAIL</span>' : '<span class="pill pass">PASS</span>';
    const p = L.tests ? L.passed / L.tests * 100 : 0, fl = L.tests ? L.failed / L.tests * 100 : 0;
    body = `<div class="v">${L.passed}<span class="sub" style="font-size:16px"> / ${L.tests}</span></div><div class="sub">${L.failed} failed · ${L.skipped} skipped</div><div class="bar"><i style="width:${p}%;background:var(--ok)"></i><i style="width:${fl}%;background:var(--bad)"></i></div>`;
  }
  cards.append($(`<div class="card"><div class="k">${esc(L.name)} ${status}</div>${body}</div>`));
}
app.append(cards);

// ---- failures
const fails = D.layers.flatMap(L => (L.failures || []).map(x => ({...x, layer: L.name})));
app.append($('<h2>Failed tests</h2>'));
app.append(fails.length ? $(`<div class="card"><table><tr><th>Layer</th><th>Test</th><th>Message</th></tr>${fails.map(x => `<tr><td>${esc(x.layer)}</td><td><code>${esc(x.name)}</code></td><td class="msg">${esc(x.message)}</td></tr>`).join('')}</table></div>`)
  : $('<div class="empty">No failed tests in the layers that ran.</div>'));

// ---- charts
function lineChart(title, unit, series) {
  const W = 560, H = 230, P = {l: 44, r: 10, t: 12, b: 26};
  const all = series.flatMap(s => s.pts);
  if (!all.length) return `<div class="card"><div class="k">${title}</div><div class="empty">No samples.</div></div>`;
  const maxX = Math.max(...series.map(s => s.pts.length - 1), 1);
  const lo = 0, hi = Math.max(...all) * 1.08 || 1;
  const X = i => P.l + i / maxX * (W - P.l - P.r), Y = v => H - P.b - (v - lo) / (hi - lo) * (H - P.t - P.b);
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = lo + (hi - lo) * k / 4; g += `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${P.l - 6}" y="${Y(v) + 4}" text-anchor="end">${v.toFixed(v < 10 ? 1 : 0)}</text>`; }
  const paths = series.map(s => `<polyline fill="none" stroke="${s.color}" stroke-width="1.6" stroke-dasharray="${s.dash || ''}" points="${s.pts.map((v, i) => X(i).toFixed(1) + ',' + Y(v).toFixed(1)).join(' ')}"/>`).join('');
  const legend = series.map(s => `<span><b style="background:${s.color}"></b>${esc(s.name)}</span>`).join('');
  return `<div class="card"><div class="k">${title}</div><svg viewBox="0 0 ${W} ${H}" width="100%">${g}${paths}<text x="${W - P.r}" y="${H - 6}" text-anchor="end">${unit}</text></svg><div class="legend">${legend}</div></div>`;
}
function barChart(title, rows) {
  const W = 560, rowH = 46, H = rows.length * rowH + 10, L = 120;
  rows = rows.map(r => ({...r, on: num(r.on), off: num(r.off)}));
  const max = Math.max(...rows.flatMap(r => [r.on, r.off].filter(x => x != null)), 1);
  const bw = v => v == null ? 0 : v / max * (W - L - 70);
  const body = rows.map((r, i) => { const y = i * rowH + 6; return `<text x="0" y="${y + 18}">${esc(r.name)}</text>
    <rect x="${L}" y="${y}" height="15" rx="3" width="${bw(r.on)}" fill="var(--on)"/><text x="${L + bw(r.on) + 6}" y="${y + 12}">${r.on == null ? 'n/a' : f(r.on, r.d)}</text>
    <rect x="${L}" y="${y + 19}" height="15" rx="3" width="${bw(r.off)}" fill="var(--off)"/><text x="${L + bw(r.off) + 6}" y="${y + 31}">${r.off == null ? 'n/a' : f(r.off, r.d)}</text>`; }).join('');
  return `<div class="card"><div class="k">${title}</div><svg viewBox="0 0 ${W} ${H}" width="100%">${body}</svg><div class="legend"><span><b style="background:var(--on)"></b>QuillCore ON</span><span><b style="background:var(--off)"></b>OFF</span></div></div>`;
}
// grouped bars: one group per mode (ON / OFF), one bar per FPS metric; mode colour, metric by opacity
function groupedChart(title, groups, metrics) {
  const W = 560, H = 240, P = {l: 44, r: 10, t: 22, b: 40}, gap = 36;
  const vals = groups.flatMap(g => metrics.map(m => num(g.v[m.k]))).filter(v => v != null);
  if (!vals.length) return `<div class="card"><div class="k">${title}</div><div class="empty">No FPS summary.</div></div>`;
  const hi = Math.max(...vals) * 1.12 || 1, ih = H - P.t - P.b, Y = v => H - P.b - v / hi * ih;
  const gw = (W - P.l - P.r - gap * (groups.length - 1)) / groups.length, bw = Math.min(64, (gw - 12) / metrics.length);
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = hi * k / 4; g += `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${P.l - 6}" y="${Y(v) + 4}" text-anchor="end">${v.toFixed(0)}</text>`; }
  const body = groups.map((G, gi) => {
    const x0 = P.l + gi * (gw + gap) + (gw - bw * metrics.length - 6 * (metrics.length - 1)) / 2;
    const bars = metrics.map((m, mi) => { const v = num(G.v[m.k]), x = x0 + mi * (bw + 6), cx = x + bw / 2;
      return v == null ? `<text x="${cx}" y="${H - P.b - 6}" text-anchor="middle">n/a</text><text x="${cx}" y="${H - P.b + 14}" text-anchor="middle">${m.short}</text>`
        : `<rect x="${x}" y="${Y(v)}" width="${bw}" height="${H - P.b - Y(v)}" rx="3" fill="${G.color}" fill-opacity="${m.op}"/><text x="${cx}" y="${Y(v) - 5}" text-anchor="middle">${v.toFixed(1)}</text><text x="${cx}" y="${H - P.b + 14}" text-anchor="middle">${m.short}</text>`; }).join('');
    return bars + `<text x="${P.l + gi * (gw + gap) + gw / 2}" y="${H - 8}" text-anchor="middle" style="fill:${G.color};font-weight:600">${esc(G.name)}${num(G.v[metrics[1].k]) != null && num(G.v[metrics[0].k]) ? ' · 1% low = ' + ratio(G.v[metrics[1].k], G.v[metrics[0].k]) + ' of avg' : ''}</text>`;
  }).join('');
  const legend = metrics.map(m => `<span><b style="background:var(--fg);opacity:${m.op}"></b>${esc(m.name)}</span>`).join('');
  return `<div class="card"><div class="k">${title}</div><svg viewBox="0 0 ${W} ${H}" width="100%">${g}${body}</svg><div class="legend">${legend}</div></div>`;
}
app.append($('<h2>Client benchmark — QuillCore ON vs OFF</h2>'));
const B = D.bench;
if (!B || !B.segments || !B.segments.length) {
  app.append($(`<div class="empty">Benchmark not run${D.benchNote ? ' — ' + esc(D.benchNote) : ''}. Numbers appear here only after a real run (<code>gradlew quillTest -PwithBench</code>).</div>`));
} else {
  const segs = B.segments, S = B.summary || {};
  if (B.valid === false) app.append($(`<div class="card" style="border-color:#b7791f;margin-bottom:14px"><b style="color:#b7791f">INVALID benchmark — shown for diagnosis only, do not compare these numbers:</b><ul>${B.invalidReasons.map(r => `<li>${esc(r)}</li>`).join('')}</ul></div>`));
  const col = (s, k) => ({name: `${s.label.toUpperCase()} #${s.segment + 1}`, color: s.label === 'on' ? 'var(--on)' : 'var(--off)', dash: k % 2 ? '' : '', pts: (s[k] || []).map(num).filter(v => v != null)});
  const byLabel = (k) => segs.map((s, i) => ({...col(s, k), dash: segs.slice(0, i).filter(x => x.label === s.label).length ? '5 3' : ''}));
  const charts = $('<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr))"></div>');
  charts.append($(lineChart('FPS over time (per second)', 'seconds', byLabel('fpsPerSecond'))));
  charts.append($(lineChart('Frame time (ms, bucket max — spikes kept)', 'samples', byLabel('frameTimeMsSeries'))));
  const has01 = segs.some(s => num(s.pct01LowFps) != null) || num(S.pct01LowFps?.on) != null || num(S.pct01LowFps?.off) != null;
  const fpsM = [{k: 'avgFps', name: 'Avg FPS', short: 'avg', op: 1}, {k: 'pct1LowFps', name: '1% low', short: '1% low', op: .6}].concat(has01 ? [{k: 'pct01LowFps', name: '0.1% low', short: '0.1% low', op: .32}] : []);
  const side = (lab) => Object.fromEntries(fpsM.map(m => [m.k, S[m.k]?.[lab]]));
  charts.append($(groupedChart('Avg FPS vs 1% low' + (has01 ? ' / 0.1% low' : '') + ' — mean of segments', [{name: 'QuillCore ON', color: 'var(--on)', v: side('on')}, {name: 'OFF', color: 'var(--off)', v: side('off')}], fpsM)));
  charts.append($(barChart('Integrated server tick (MSPT) & frame time', [
    {name: 'MSPT avg', on: S.msptAvg?.on, off: S.msptAvg?.off, d: 2}, {name: 'Frame p50 ms', on: S.frameTimeP50Ms?.on, off: S.frameTimeP50Ms?.off, d: 2}, {name: 'Frame p99 ms', on: S.frameTimeP99Ms?.on, off: S.frameTimeP99Ms?.off, d: 2}])));
  app.append(charts);
  const pct = (k) => num(S[k]?.onVsOffPct) == null ? 'n/a' : (S[k].onVsOffPct > 0 ? '+' : '') + f(S[k].onVsOffPct) + '%';
  const c01 = (v) => has01 ? `<td>${f(v)}</td>` : '';
  const meanRow = (lab, name) => `<tr><th>${name} mean</th><th>${f(S.avgFps?.[lab])}</th><th>${f(S.pct1LowFps?.[lab])}</th>${has01 ? `<th>${f(S.pct01LowFps?.[lab])}</th>` : ''}<th>${ratio(S.pct1LowFps?.[lab], S.avgFps?.[lab])}</th><th>${f(S.frameTimeP50Ms?.[lab], 2)}</th><th>${f(S.frameTimeP99Ms?.[lab], 2)}</th><th>${f(S.msptAvg?.[lab], 2)}</th></tr>`;
  app.append($(`<div class="card" style="margin-top:14px"><table><tr><th>Segment</th><th>Avg FPS</th><th>1% low</th>${has01 ? '<th>0.1% low</th>' : ''}<th>1% low / avg</th><th>p50 ms</th><th>p99 ms</th><th>MSPT</th></tr>
    ${segs.map(s => `<tr><td>${esc(String(s.label).toUpperCase())} #${s.segment + 1}</td><td>${f(s.avgFps)}</td><td>${f(s.pct1LowFps)}</td>${c01(s.pct01LowFps)}<td>${ratio(s.pct1LowFps, s.avgFps)}</td><td>${f(s.frameTimeP50Ms, 2)}</td><td>${f(s.frameTimeP99Ms, 2)}</td><td>${f(s.msptAvg, 2)}</td></tr>`).join('')}
    ${meanRow('on', 'ON')}${meanRow('off', 'OFF')}
    <tr><th>ON vs OFF</th><th>${pct('avgFps')}</th><th>${pct('pct1LowFps')}</th>${has01 ? `<th>${pct('pct01LowFps')}</th>` : ''}<th></th><th>${pct('frameTimeP50Ms')}</th><th>${pct('frameTimeP99Ms')}</th><th>${pct('msptAvg')}</th></tr></table></div>`));
}

// ---- metadata
app.append($('<h2>Run metadata</h2>'));
const rows = Object.entries(m).filter(([k]) => k !== 'generated').map(([k, v]) => `<tr><td class="sub">${esc(k)}</td><td><code>${esc(v)}</code></td></tr>`).join('');
app.append($(`<div class="card"><table>${rows}</table></div>`));
app.append($('<p class="sub" style="margin-top:20px">Only measured data is shown. Layers that did not run are marked “not run”. Follows your OS light/dark setting (prefers-color-scheme).</p>'));
}
if (EMBED) render(EMBED); else if (window.quillLoad) window.quillLoad(render);
const fsBtn = document.getElementById('fs');
const toggleFs = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => { fsBtn.textContent = 'Press F11 for fullscreen'; });
fsBtn.onclick = toggleFs;
document.addEventListener('keydown', e => { if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey) toggleFs(); });
document.addEventListener('fullscreenchange', () => { fsBtn.textContent = document.fullscreenElement ? '✕ Exit fullscreen (Esc)' : '⛶ Fullscreen'; });
</script>
</body></html>
